<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f10">
  <title>Offline · Nodexia</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/shell.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="shell shell--standalone">
    <main class="shell-main shell-main--centered">
      <section class="hero">
        <article class="card empty-state-card empty-state-card--offline">
          <span class="empty-state-icon"><i data-lucide="wifi-off" aria-hidden="true"></i></span>
          <h1 class="empty-state-title offline-card__title">Offline</h1>
          <p class="empty-state-desc offline-card__desc">
            Unable to reach the Nodexia control plane. Status, metrics, and node
            actions resume automatically once your connection returns.
          </p>
          <div class="form-actions form-actions--center">
            <button type="button" class="btn btn--primary" data-offline-retry>
              <i data-lucide="refresh-cw" class="icon-in-button" aria-hidden="true"></i> Try again
            </button>
          </div>
        </article>
      </section>
    </main>
  </div>
  <script src="/static/lucide.min.js" defer></script>
  <script src="/static/offline.js" defer></script>
</body>
</html>
