<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f10">
  <title>Offline · Nodexia</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/shell.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="shell shell--standalone">
    <main class="shell-main shell-main--centered">
      <section class="hero">
        <article class="card empty-state-card empty-state-card--offline">
          <span class="empty-state-icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 5.17-2.69"/><path d="M19 12.859a10 10 0 0 0-2.007-1.523"/><path d="M2 8.82a15 15 0 0 1 4.177-2.643"/><path d="M22 8.82a15 15 0 0 0-11.288-3.764"/><path d="m2 2 20 20"/></svg>
          </span>
          <h1 class="empty-state-title offline-card__title">Offline</h1>
          <p class="empty-state-desc offline-card__desc">
            Unable to reach the Nodexia control plane. Status, metrics, and node
            actions resume automatically once your connection returns.
          </p>
          <div class="form-actions form-actions--center">
            <button type="button" class="btn btn--primary" data-offline-retry>
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-in-button" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg> Try again
            </button>
          </div>
        </article>
      </section>
    </main>
  </div>
  <script src="/static/offline.js" defer></script>
</body>
</html>
