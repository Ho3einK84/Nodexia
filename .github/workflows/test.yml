name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # "1.25.x" floats to the newest 1.25 patch; check-latest forces a
          # lookup against the upstream Go release list instead of settling for
          # the highest patch already cached on the runner image.
          go-version: "1.25.x"
          check-latest: true

      - name: Run vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Run tests with race detector
        run: go test -race ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run vulnerability scan
        run: govulncheck ./...

      - name: Build binary
        run: go build -trimpath -ldflags="-s -w -X main.version=v0.7.2" -o nodexia ./cmd/nodexia
